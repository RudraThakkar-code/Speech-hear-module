spring.datasource.url=jdbc:h2:mem:speech_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=com.example.clinical.config.H2PostgresEnumDialect
spring.jpa.properties.hibernate.dialect=com.example.clinical.config.H2PostgresEnumDialect
spring.flyway.enabled=false
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
